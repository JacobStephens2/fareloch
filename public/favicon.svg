<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Fareloch</title>
  <defs>
    <!-- Deep-water teal from the Fareloch palette. -->
    <linearGradient id="bg" x1="72" y1="0" x2="440" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="55%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect id="background" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- A simple enclosed basin retains the loch motif. -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="#FFFFFF" stroke-width="22"/>

  <!-- A bold F identifies Fareloch without relying on an ambiguous water shape. -->
  <path fill="#FFFFFF" d="M 192 146 H 334 V 186 H 236 V 230 H 320 V 270 H 236 V 340 H 192 Z"/>

  <!-- Macro indicator dots: Carbs · Protein · Fat -->
  <circle cx="214" cy="364" r="12" fill="#3B82F6"/>
  <circle cx="256" cy="364" r="12" fill="#EF4444"/>
  <circle cx="298" cy="364" r="12" fill="#F59E0B"/>
</svg>
